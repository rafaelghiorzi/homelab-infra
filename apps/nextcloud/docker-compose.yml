services:
  db:
    image: postgres:alpine
    restart: unless-stopped
    volumes:
      - ${POSTGRES_DATA}:/var/lib/postgresql
    environment:
      - PGDATA=/var/lib/postgresql/data
    env_file:
      - /opt/homelab/secrets/.env
    networks:
      - storage

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - storage

  app:
    image: nextcloud:apache
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - nextcloud_app:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - /opt/homelab/secrets/.env
    depends_on:
      - db
      - redis
    networks:
      - storage
      - proxy

  cron:
    image: nextcloud:apache
    restart: unless-stopped
    volumes:
      - nextcloud_app:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    networks:
      - storage

volumes:
  nextcloud_app:

networks:
  storage:
    name: storage
    driver: bridge
  proxy:
    external: true
    name: proxy